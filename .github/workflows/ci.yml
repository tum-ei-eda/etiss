name: Build ETISS and run smoke tests

on:
  push:
    paths-ignore:
    - docs/
  pull_request:
    paths-ignore:
    - docs/
  workflow_dispatch: {}

jobs:
  build_etiss:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        build_type: [Release]

    steps:
    - uses: actions/checkout@v7
      with:
        path: etiss_source
        submodules: true

    - name: Install build dependencies
      run: |
        sudo apt update
        sudo apt remove -y llvm* clang* libllvm* libclang*
        sudo apt install -y libboost-filesystem-dev libboost-program-options-dev \
          llvm-15-dev libclang-15-dev clang-15

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1
      with:
        max-size: 2G
        key: ccache-${{ matrix.build_type }}
        variant: sccache

    - name: CMake config
      run: |
        cmake -B etiss_build -S etiss_source -DCMAKE_INSTALL_PREFIX=etiss_prebuilt -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

    - name: CMake build
      run: |
        cmake --build etiss_build -j$(nproc)

    - name: CMake install
      run: |
        cmake --build etiss_build --target install

    - name: Upload compiled ETISS
      uses: actions/upload-artifact@v7
      with:
        name: etiss_prebuilt
        path: etiss_prebuilt

  build_examples:
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        bits: ["32", "64"]
        toolchain: [gcc, llvm]
        build_type: [Release]

    steps:
    - uses: actions/checkout@v7
      with:
        repository: tum-ei-eda/etiss_riscv_examples
        path: examples_source
        submodules: true

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1
      with:
        max-size: 2G
        key: ccache-examples-${{ matrix.build_type }}-rv${{ matrix.bits }}
        variant: sccache

    - name: Install cross compiler
      run: |
        wget https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v13.2.0-2/xpack-riscv-none-elf-gcc-13.2.0-2-linux-x64.tar.gz
        tar xf xpack-riscv-none-elf-gcc-13.2.0-2-linux-x64.tar.gz
        mv xpack-riscv-none-elf-gcc-13.2.0-2 riscv_tc

    - name: Install latest LLVM
      run: |
        # RISC-V Examples need LLVM 18+
        sudo apt-get update
        sudo apt remove -y llvm* clang* libllvm* libclang*
        sudo bash -c "$(wget -O - https://apt.llvm.org/llvm.sh)"

    - name: Set CMake preset
      id: cmake_preset
      shell: bash
      run: |
        build_type_lower="${{ matrix.build_type }}"
        build_type_lower="${build_type_lower,,}"
        preset="rv${{ matrix.bits }}-${{ matrix.toolchain }}-${build_type_lower}"
        echo "name=${preset}" >> "$GITHUB_OUTPUT"

    - name: Configure examples
      run: |
        cmake -B examples_build_${{ matrix.toolchain }}_rv${{ matrix.bits }} -S examples_source --preset ${{ steps.cmake_preset.outputs.name }} -DRISCV_TOOLCHAIN_BASENAME=riscv-none-elf -DRISCV_TOOLCHAIN_PREFIX=$GITHUB_WORKSPACE/riscv_tc -DCMAKE_INSTALL_PREFIX=examples_prebuilt_rv${{ matrix.bits }} -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

    - name: Build examples
      run: |
        cmake --build examples_build_${{ matrix.toolchain }}_rv${{ matrix.bits }} -j$(nproc)

    - name: Install examples
      run: |
        cmake --build examples_build_${{ matrix.toolchain }}_rv${{ matrix.bits }} --target install

    - name: Upload prebuilt examples
      uses: actions/upload-artifact@v7
      with:
        name: examples_prebuilt_${{ matrix.toolchain }}_rv${{ matrix.bits }}
        path: examples_prebuilt_${{ matrix.toolchain }}_rv${{ matrix.bits }}

  run_examples:
    runs-on: ubuntu-22.04
    needs: [build_etiss, build_examples]

    strategy:
      matrix:
        bits: ["32", "64"]
        toolchain: [gcc, llvm]
        jit_engine: ["TCC", "GCC", "LLVM"]
        test_program: ["example_c", "example_cpp", "test_cases"]

    steps:
    - name: Fetch precompiled artifacts
      uses: actions/download-artifact@v8

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libboost-filesystem-dev libboost-program-options-dev

    - name: Run test
      run: |
        chmod +x etiss_prebuilt/bin/bare_etiss_processor
        etiss_prebuilt/bin/bare_etiss_processor -iexamples_prebuilt_${{ matrix.toolchain }}_rv${{ matrix.bits }}/ini/${{ matrix.test_program }}.ini --jit.type=${{ matrix.jit_engine }}JIT

  run_benchmarks:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-22.04
    needs: [build_etiss, build_examples]

    strategy:
      matrix:
        bits: ["32", "64"]
        toolchain: [gcc]
        jit_engine: ["TCC", "GCC", "LLVM"]
        # run_no: [1, 2, 3, 4, 5]
        run_no: [1, 5]

    steps:
    - name: Fetch precompiled artifacts
      uses: actions/download-artifact@v8

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libboost-filesystem-dev libboost-program-options-dev
        # Install latest LLVM (RISC-V Examples need LLVM 18+)
        sudo bash -c "$(wget -O - https://apt.llvm.org/llvm.sh)"

    - name: Run benchmark
      run: |
        chmod +x etiss_prebuilt/bin/bare_etiss_processor
        etiss_prebuilt/bin/bare_etiss_processor -iexamples_prebuilt_${{ matrix.toolchain }}_rv${{ matrix.bits }}/ini/dhry.ini --jit.type=${{ matrix.jit_engine }}JIT --vp.stats_file_path=${{ github.workspace }}/run_${{ matrix.jit_engine }}_${{ matrix.bits }}_${{ matrix.run_no }}.json

    - name: Save Benchmark results
      uses: actions/upload-artifact@v7
      with:
        name: run_${{ matrix.jit_engine }}_${{ matrix.bits }}_${{ matrix.run_no }}
        path: run_${{ matrix.jit_engine }}_${{ matrix.bits }}_${{ matrix.run_no }}.json

  merge_benchmark_results:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-22.04
    needs: run_benchmarks

    steps:
    - name: Merge artifacts
      uses: actions/upload-artifact/merge@v7
      with:
        name: dhry_results
        pattern: run_*
        delete-merged: true
